# Java/Spring team formatting policy.
# Four spaces are used instead of tabs so rendering is identical in every IDE and CI log.
org.eclipse.jdt.core.formatter.tabulation.char=space
org.eclipse.jdt.core.formatter.tabulation.size=4
org.eclipse.jdt.core.formatter.indentation.size=4
org.eclipse.jdt.core.formatter.continuation_indentation=2
org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=2
org.eclipse.jdt.core.formatter.use_tabs_only_for_leading_indentations=false
org.eclipse.jdt.core.formatter.lineSplit=120
org.eclipse.jdt.core.formatter.alignment_for_selector_in_method_invocation=81
org.eclipse.jdt.core.formatter.align_selector_in_method_invocation_on_expression_first_line=true
org.eclipse.jdt.core.formatter.join_wrapped_lines=false
org.eclipse.jdt.core.formatter.alignment_for_parameters_in_method_declaration=48
# Force every record component onto its own line, even when the declaration is short.
org.eclipse.jdt.core.formatter.alignment_for_record_components=49
# Keep annotations for the same parameter or record component on separate lines.
org.eclipse.jdt.core.formatter.alignment_for_annotations_on_parameter=49
org.eclipse.jdt.core.formatter.alignment_for_type_annotations=49
# Force every annotation argument onto its own line, regardless of line length.
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_annotation=49
# Force method and constructor call arguments onto separate lines.
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_method_invocation=49
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_allocation_expression=49
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_qualified_allocation_expression=49
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_explicit_constructor_call=49
org.eclipse.jdt.core.formatter.parentheses_positions_in_annotation=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_catch_clause=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_enum_constant_declaration=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_for_statment=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_if_while_statement=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_lambda_declaration=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_method_delcaration=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_method_invocation=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_record_declaration=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_switch_statement=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_try_clause=separate_lines_if_wrapped
