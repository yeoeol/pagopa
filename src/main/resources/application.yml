server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 100
    show-sql: false

  cloud:
    azure:
      storage:
        blob:
          account-name: ${AZURE_STORAGE_ACCOUNT_NAME}
          account-key: ${AZURE_STORAGE_ACCOUNT_KEY}
          endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          google-admin:
            provider: google
            client-id: ${GOOGLE_ADMIN_CLIENT_ID}
            client-secret: ${GOOGLE_ADMIN_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: account_email, profile_nickname, profile_image
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope: name, email, profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:1800000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:1209600000}

app:
  oauth2:
    redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:3000/oauth2/redirect}

  storage:
    image:
      max-size: ${IMAGE_MAX_SIZE:5242880}
      allowed-types: ${IMAGE_ALLOWED_TYPES:image/jpeg,image/png,image/webp}
    provider:
      azure:
        container-name: ${AZURE_STORAGE_CONTAINER_NAME:pagopa}
        base-url: ${AZURE_STORAGE_BASE_URL}
      supabase:
        endpoint: ${SUPABASE_STORAGE_ENDPOINT}
        region: ${SUPABASE_STORAGE_REGION}
        access-key: ${SUPABASE_STORAGE_ACCESS_KEY}
        secret-key: ${SUPABASE_STORAGE_SECRET_KEY}
        bucket: ${SUPABASE_STORAGE_BUCKET:pagopa-images}
        project-url: ${SUPABASE_PROJECT_URL}


  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  ban:
    seconds: ${BAN_SECONDS:604800}

  order:
    unpaid-before-min: ${ORDER_UNPAID_BEFORE_MIN:15}

  seed:
    enabled: ${SEED_ENABLED:false}
    batch-size: ${SEED_BATCH_SIZE:5000}
    counts:
      users: ${SEED_USERS:300000}
      products: ${SEED_PRODUCTS:100000}
      carts: ${SEED_CARTS:300000}
      cart-items: ${SEED_CART_ITEMS:600000}
      orders: ${SEED_ORDERS:1000000}
      order-items: ${SEED_ORDER_ITEMS:3000000}
      payments: ${SEED_PAYMENTS:1000000}
      reviews: ${SEED_REVIEWS:500000}
      review-images: ${SEED_REVIEW_IMAGES:300000}
      search-histories: ${SEED_SEARCH_HISTORIES:2000000}

payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    success-url: ${TOSS_SUCCESS_URL:http://localhost:3000/success}
    fail-url: ${TOSS_FAIL_URL:http://localhost:3000/fail}

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
