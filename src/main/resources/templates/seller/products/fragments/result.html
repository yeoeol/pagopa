<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section id="product-results" th:fragment="result">
    <div class="card">
        <div class="card-header">
            <div>
                <h3 class="card-title">등록 상품</h3>
                <div class="card-subtitle">상품을 확인하고 필요한 재고를 바로 추가하세요.</div>
            </div>
            <div class="ms-auto text-secondary">
                총 <strong class="text-body"
                          th:text="${#numbers.formatInteger(result.totalElements, 1, 'COMMA')}">0</strong>개
            </div>
        </div>

        <div class="table-responsive" th:if="${!result.content.isEmpty()}">
            <table class="table table-vcenter card-table table-hover seller-product-table">
                <thead>
                <tr>
                    <th>상품</th>
                    <th>상태</th>
                    <th class="text-end">판매가</th>
                    <th class="text-end">재고</th>
                    <th>상품 번호</th>
                    <th class="text-end">작업</th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="product : ${result.content}">
                    <tr th:replace="~{seller/products/fragments/row :: row(product=${product})}"></tr>
                </th:block>
                </tbody>
            </table>
        </div>

        <div class="empty py-6" th:if="${result.content.isEmpty()}">
            <div class="empty-icon seller-empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3l8 4.5v9l-8 4.5l-8 -4.5v-9z"/>
                    <path d="M12 12l8 -4.5"/>
                    <path d="M12 12v9"/>
                    <path d="M12 12l-8 -4.5"/>
                </svg>
            </div>
            <p class="empty-title">아직 등록한 상품이 없습니다.</p>
            <p class="empty-subtitle text-secondary">첫 상품을 등록하면 판매 상태와 재고를 확인할 수 있습니다.</p>
            <div class="empty-action">
                <button class="btn btn-primary seller-primary" type="button"
                        data-bs-toggle="modal" data-bs-target="#product-register-modal">첫 상품 등록</button>
            </div>
        </div>

        <div class="card-footer d-flex align-items-center" th:if="${!result.content.isEmpty()}">
            <p class="m-0 text-secondary">
                <span th:text="${result.page * result.size + 1}">1</span>–<span
                    th:text="${result.page * result.size + result.content.size()}">10</span> 표시
            </p>
            <div class="ms-auto"
                 th:replace="~{seller/products/fragments/pagination :: pagination(${result})}"></div>
        </div>
    </div>
</section>
</body>
</html>
