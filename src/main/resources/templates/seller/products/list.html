<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{seller/layout/shell :: shell('상품 관리', 'products', ~{::main})}">
<body>
<main id="seller-products-page" th:attr="data-logout-api=@{/api/v1/auth/logout}">
    <div class="page-header d-print-none">
        <div class="container-xl">
            <div class="row g-3 align-items-center">
                <div class="col">
                    <div class="page-pretitle">PRODUCT OPERATIONS</div>
                    <h2 class="page-title">상품 관리</h2>
                    <div class="text-secondary mt-1">판매 중인 상품과 재고를 한곳에서 관리합니다.</div>
                </div>
                <div class="col-auto ms-auto">
                    <button class="btn btn-primary seller-primary" type="button"
                            data-bs-toggle="modal" data-bs-target="#product-register-modal">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M12 5v14"/>
                            <path d="M5 12h14"/>
                        </svg>
                        상품 등록
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">
            <div class="alert alert-success" role="status" th:if="${notice == 'registered'}">
                새 상품을 등록했습니다.
            </div>
            <div class="alert alert-success" role="status" th:if="${notice == 'stock-added'}">
                상품 재고를 추가했습니다.
            </div>
            <div class="alert alert-danger" role="alert" th:if="${notice == 'invalid-stock'}">
                재고 수량을 확인해 주세요.
            </div>

            <div th:replace="~{seller/products/fragments/filters :: filters}"></div>
            <section id="product-results" aria-live="polite"
                     th:replace="~{seller/products/fragments/result :: result}"></section>
        </div>
    </div>

    <div th:replace="~{seller/products/fragments/register-modal :: register}"></div>

    <div class="modal modal-blur fade" id="product-detail-modal" tabindex="-1"
         aria-labelledby="product-detail-title" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content" id="product-detail-content">
                <div class="modal-body py-6 text-center">
                    <div class="spinner-border text-primary" role="status"></div>
                    <div class="text-secondary mt-3">상품 정보를 불러오는 중입니다.</div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
