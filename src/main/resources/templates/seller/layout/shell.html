<!doctype html>
<html lang="ko"
      data-bs-theme="light"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="shell(pageTitle, activeMenu, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${pageTitle} · Pagopa Seller|">Pagopa Seller</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/admin-assets/favicon.svg}">

    <link rel="stylesheet" th:href="@{/admin-assets/vendor/tabler/1.4.0/tabler.min.css}">
    <link rel="stylesheet" th:href="@{/seller-assets/css/seller.css}">
    <script defer th:src="@{/admin-assets/vendor/tabler/1.4.0/tabler.min.js}"></script>
    <script defer th:src="@{/admin-assets/vendor/htmx/2.0.10/htmx.min.js}"></script>
    <script defer th:src="@{/seller-assets/js/seller.js}"></script>
</head>
<body class="layout-fluid">
<div class="page">
    <aside th:replace="~{seller/fragments/sidebar :: sidebar(${activeMenu})}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{seller/fragments/topbar :: topbar}"></header>
        <th:block th:replace="${content}"></th:block>
        <footer class="footer footer-transparent d-print-none">
            <div class="container-xl">
                <div class="text-secondary small">Pagopa 판매자 센터</div>
            </div>
        </footer>
    </div>
</div>
<div id="seller-notice" class="seller-notice" aria-live="polite"></div>
</body>
</html>
