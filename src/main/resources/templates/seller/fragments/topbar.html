<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="navbar navbar-expand-md d-print-none" th:fragment="topbar">
    <div class="container-xl">
        <div class="navbar-nav flex-row order-md-last ms-auto align-items-center gap-2">
            <button id="theme-toggle" class="btn btn-icon btn-ghost-secondary"
                    type="button" aria-label="화면 테마 전환" title="화면 테마 전환">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3c.132 0 .263 .002 .393 .008a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/>
                </svg>
            </button>

            <div class="d-none d-sm-block text-end lh-sm">
                <div class="fw-semibold">판매자</div>
                <div class="text-secondary small" th:text="${#authentication.principal.email}">seller@example.com</div>
            </div>

            <button id="seller-logout" class="btn btn-outline-secondary btn-sm" type="button">로그아웃</button>
        </div>
    </div>
</header>
</body>
</html>
