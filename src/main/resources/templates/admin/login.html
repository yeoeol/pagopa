<!doctype html>
<html lang="ko" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인 · Pagopa</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/admin-assets/favicon.svg}">
    <link rel="stylesheet" th:href="@{/admin-assets/vendor/tabler/1.4.0/tabler.min.css}">
    <link rel="stylesheet" th:href="@{/admin-assets/css/admin.css}">
</head>
<body class="d-flex flex-column bg-body-tertiary">
<div class="page page-center">
    <div class="container container-tight py-4">
        <div class="text-center mb-4">
            <span class="admin-brand-mark admin-brand-mark-lg">P</span>
        </div>

        <div class="card card-md">
            <div class="card-body">
                <h2 class="h2 text-center mb-2">Pagopa 관리자 로그인</h2>
                <p class="text-secondary text-center mb-4">관리자 권한이 등록된 Google 계정으로 로그인하세요.</p>

                <div class="alert alert-danger" role="alert" th:if="${param.error}">
                    로그인 처리 중 문제가 발생했습니다.
                </div>
                <div class="alert alert-success" role="alert" th:if="${param.logout}">
                    안전하게 로그아웃했습니다.
                </div>

                <a class="btn btn-white w-100" th:href="@{/oauth2/authorization/google-admin}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                         viewBox="0 0 24 24" class="me-2" aria-hidden="true">
                        <path fill="#4285f4" d="M21.6 12.227c0-.709-.064-1.391-.182-2.045H12v3.868h5.382a4.6 4.6 0 0 1-1.995 3.018v2.51h3.232c1.891-1.74 2.981-4.304 2.981-7.35z"/>
                        <path fill="#34a853" d="M12 22c2.7 0 4.964-.895 6.619-2.423l-3.232-2.509c-.895.6-2.041.955-3.387.955-2.605 0-4.81-1.76-5.6-4.123H3.059v2.591A9.997 9.997 0 0 0 12 22z"/>
                        <path fill="#fbbc05" d="M6.4 13.9A6.01 6.01 0 0 1 6.086 12c0-.659.114-1.3.314-1.9V7.509H3.059A9.997 9.997 0 0 0 2 12c0 1.614.386 3.141 1.059 4.491L6.4 13.9z"/>
                        <path fill="#ea4335" d="M12 5.977c1.468 0 2.786.505 3.823 1.495l2.868-2.868C16.959 2.991 14.695 2 12 2a9.997 9.997 0 0 0-8.941 5.509L6.4 10.1C7.19 7.736 9.395 5.977 12 5.977z"/>
                    </svg>
                    Google로 계속하기
                </a>
            </div>
        </div>

        <p class="text-center text-secondary mt-3 mb-0 small">
            권한이 없는 계정은 관리자 화면에 접근할 수 없습니다.
        </p>
    </div>
</div>
</body>
</html>
