<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="detail"
          th:with="statusName=${user.status.status.name()}">
    <div class="modal-header">
        <div>
            <div class="text-secondary small">회원 번호 <span th:text="${user.userId}">1</span></div>
            <h3 class="modal-title" id="user-detail-title" th:text="${user.name}">회원 상세</h3>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
    </div>
    <div class="modal-body">
        <div class="d-flex align-items-center gap-3 mb-4">
            <span class="avatar avatar-xl"
                  th:style="${user.profileImageUrl != null} ? |background-image: url('${user.profileImageUrl}')| : ''"
                  th:text="${user.profileImageUrl == null ? #strings.substring(user.name, 0, 1) : ''}">A</span>
            <div>
                <div class="h3 mb-1" th:text="${user.name}">회원 이름</div>
                <div class="text-secondary" th:text="${user.email}">user@example.com</div>
            </div>
        </div>

        <dl class="row admin-detail-list mb-0">
            <dt class="col-sm-4">상태</dt>
            <dd class="col-sm-8">
                <span class="badge"
                      th:classappend=
                              "${statusName == 'ACTIVE'
                              ? 'text-bg-success'
                              : (statusName == 'SUSPENDED'
                                   ? 'text-bg-warning'
                                   : (statusName == 'BANNED'
                                        ? 'text-bg-danger'
                                        : 'text-bg-secondary'))}"
                      th:text="${user.status.description}">
                    정상
                </span>
            </dd>
            <dt class="col-sm-4">권한</dt>
            <dd class="col-sm-8">
                <div th:replace=
                             "~{admin/users/fragments/role-badges
                                :: roleBadges(roles=${user.roles})}">
                </div>
            </dd>

            <dt class="col-sm-4">가입 경로</dt>
            <dd class="col-sm-8" th:text="${user.provider}">GOOGLE</dd>

            <dt class="col-sm-4">전화번호</dt>
            <dd class="col-sm-8" th:text="${user.phoneNumber != null ? user.phoneNumber : '-'}">-</dd>

            <dt class="col-sm-4">가입일</dt>
            <dd class="col-sm-8"
                th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</dd>

            <dt class="col-sm-4">최근 수정일</dt>
            <dd class="col-sm-8"
                th:text="${user.updatedAt != null ? #temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}">-</dd>

            <dt class="col-sm-4" th:if="${statusName == 'SUSPENDED' && user.statusChangedAt != null}">정지일</dt>
            <dd class="col-sm-8" th:if="${statusName == 'SUSPENDED' && user.statusChangedAt != null}"
                th:text="${#temporals.format(user.statusChangedAt, 'yyyy-MM-dd HH:mm')}">-</dd>

            <dt class="col-sm-4" th:if="${statusName == 'WITHDRAWN' && user.statusChangedAt != null}">탈퇴일</dt>
            <dd class="col-sm-8" th:if="${statusName == 'WITHDRAWN' && user.statusChangedAt != null}"
                th:text="${#temporals.format(user.statusChangedAt, 'yyyy-MM-dd HH:mm')}">-</dd>
        </dl>
    </div>
    <div class="modal-footer">
        <!-- 왼쪽: 상태 변경 버튼 -->
        <div class="d-flex flex-wrap align-items-center gap-2 me-auto">
            <!-- 임시정지 또는 영구정지 해제 -->
            <button th:if="${statusName == 'SUSPENDED' or statusName == 'BANNED'}"
                    type="button"
                    class="btn btn-success"
                    th:attr="
                    hx-post=@{|/admin/users/${user.userId}/status/activate|},
                    hx-confirm=${statusName == 'SUSPENDED'
                        ? '이 회원의 임시정지를 해제하시겠습니까?'
                        : '이 회원의 영구정지를 해제하시겠습니까?'}"
                    hx-target="#user-detail-content"
                    hx-swap="innerHTML"
                    hx-indicator="#status-change-indicator"
                    hx-disabled-elt="this"
                    data-user-status-action
                    data-success-message="회원 상태를 정상으로 변경했습니다."
                    th:text="${statusName == 'SUSPENDED'
                    ? '임시정지 해제'
                    : '영구정지 해제'}">
                정지 해제
            </button>

            <!-- 정상 회원 임시정지 -->
            <button th:if="${statusName == 'ACTIVE'}"
                    type="button"
                    class="btn btn-warning"
                    th:attr="hx-post=@{|/admin/users/${user.userId}/status/suspend|}"
                    hx-confirm="이 회원을 임시정지 처리하시겠습니까?"
                    hx-target="#user-detail-content"
                    hx-swap="innerHTML"
                    hx-indicator="#status-change-indicator"
                    hx-disabled-elt="this"
                    data-user-status-action
                    data-success-message="회원을 임시정지 처리했습니다.">
                임시정지
            </button>

            <!-- 정상 또는 임시정지 회원 영구정지 -->
            <button th:if="${statusName == 'ACTIVE' or statusName == 'SUSPENDED'}"
                    type="button"
                    class="btn btn-danger"
                    th:attr="hx-post=@{|/admin/users/${user.userId}/status/ban|}"
                    hx-confirm="이 회원을 영구정지 처리하시겠습니까?"
                    hx-target="#user-detail-content"
                    hx-swap="innerHTML"
                    hx-indicator="#status-change-indicator"
                    hx-disabled-elt="this"
                    data-user-status-action
                    data-success-message="회원을 영구정지 처리했습니다.">
                영구정지
            </button>

            <span id="status-change-indicator"
                  class="spinner-border spinner-border-sm htmx-indicator"
                  aria-label="상태 변경 중">
        </span>

            <span th:if="${statusName == 'WITHDRAWN'}"
                  class="text-secondary small">
            탈퇴 회원은 상태를 변경할 수 없습니다.
        </span>
        </div>

        <!-- 오른쪽: 닫기 버튼 -->
        <button type="button"
                class="btn btn-secondary ms-auto"
                data-bs-dismiss="modal">
            닫기
        </button>
    </div>
</th:block>
</body>
</html>
