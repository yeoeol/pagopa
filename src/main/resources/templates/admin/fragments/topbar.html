<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="navbar navbar-expand-md d-print-none" th:fragment="topbar">

        <div class="navbar-nav flex-row order-md-last ms-auto align-items-center gap-2">
            <button id="theme-toggle" class="btn btn-icon btn-ghost-secondary"
                    type="button" aria-label="화면 테마 전환" title="화면 테마 전환">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"

            <span class="text-secondary d-none d-sm-inline">관리자</span>

        </div>
    </div>
