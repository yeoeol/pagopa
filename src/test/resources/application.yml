server:
  port: 8080

spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:pagopa-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    show-sql: false

  cloud:
    azure:
      storage:
        blob:
          account-name: devstoreaccount1
          account-key: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
          endpoint: http://127.0.0.1:10000/devstoreaccount1

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: email, profile
          google-admin:
            provider: google
            client-id: test-google-admin-client-id
            client-secret: test-google-admin-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            scope: email, profile
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: account_email, profile_nickname, profile_image
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope: name, email, profile_image
        provider:
          kakao:
            authorization-uri: http://127.0.0.1/oauth/kakao/authorize
            token-uri: http://127.0.0.1/oauth/kakao/token
            user-info-uri: http://127.0.0.1/oauth/kakao/user
            user-name-attribute: id
          naver:
            authorization-uri: http://127.0.0.1/oauth/naver/authorize
            token-uri: http://127.0.0.1/oauth/naver/token
            user-info-uri: http://127.0.0.1/oauth/naver/user
            user-name-attribute: response

jwt:
  secret: test-only-jwt-secret-key-must-be-at-least-32-bytes-long
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

app:
  oauth2:
    redirect-url: http://localhost:3000/oauth2/redirect

  azure:
    container-name: test-container
    base-url: http://127.0.0.1:10000/devstoreaccount1/test-container
  image:
    max-size: 5242880
    allowed-types: image/jpeg, image/png, image/webp

  cors:
    allowed-origins: http://localhost:3000

  ban:
    seconds: 604800

  order:
    unpaid-before-min: 15

payment:
  toss:
    secret-key: test-toss-secret-key
    base-url: http://127.0.0.1/toss
    success-url: http://localhost:3000/success
    fail-url: http://localhost:3000/fail

management:
  endpoints:
    web:
      exposure:
        include: "*"
